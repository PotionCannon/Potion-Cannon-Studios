 if(stage>=7){

 text('____/||||\____',tx,ground+scale*.55,stage>=7?'#987b69':'#e0e8dc',scale*.93,1,'center');
 const px=tx+(side==='left'?-1:1)*scale*5.7,py=base+scale*1.2;
 glyphArt(['  _  ',' (.) ',' /|\ ',' / \ '],px,py-scale*3.2,scale*1.05,'#e7e4d6',1,'center',.94);
 text(side==='left'?'━━╱':'╲━━',px+(side==='left'?scale*2:-scale*2),py-scale*.95,'#d9ac75',scale*1.35,1,'center');
 ctx.restore();
 if(flash>0){text('*',tx+(side==='left'?-1:1)*scale*2,base,'#f4dca4',scale*2,flash,'center');flash=Math.max(0,flash-dt*5)}

 }
 for(const p of particles){

}particles=particles.filter(p=>p.life>0);
 // The forest inferno replaces falling snow with rising, windblown ash.
 if(stage>=6){
   for(const s of snow){

     text(Math.random()<.12?'*':'.',e.x,e.y,'#ff8b43',scale*.7,Math.max(0,Math.min(.8,e.life/1.4)));

}

function pickStable(i){return ['.','_','~','·'][i%4]}function frame(t){musicTick();const dt=Math.min(.05,(t-last)/1000||0);last=t;draw(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);$('peace').onclick=()=>setMode('peace');$('arcade').onclick=()=>setMode('arcade');$('resume').onclick=resume;$('inside').onclick=goInside;$('nextNight').onclick=startNextNight;$('menuBtn').onclick=pause;$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'♫ ON':'♫ OFF';if(sound)startAudio();else stopWind()};$('left').addEventListener('pointerdown',e=>{e.preventDefault();chop(-1)});$('right').addEventListener('pointerdown',e=>{e.preventDefault();chop(1)});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','KeyA','KeyD','Space','Escape'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Escape'||e.code==='Space'){if(state==='playing')pause();else if(state==='paused')resume()}if(e.code==='ArrowLeft'||e.code==='KeyA')chop(-1);if(e.code==='ArrowRight'||e.code==='KeyD')chop(1)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});})();
