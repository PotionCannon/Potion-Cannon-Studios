<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Calculator — IRL Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Teachers:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2128;
      --surface-3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #3fb950;
      --accent-teal: #2ea043;
      --accent-cyan: #39d0c0;
      --accent-glow: rgba(57, 208, 192, 0.35);
      --danger: #f85149;
      --warning: #d29922;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Teachers', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }

    .header-title span {
      display: block;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-transform: none;
      margin-top: 2px;
    }

    /* Display area */
    .display-wrap {
      padding: 8px 20px 16px;
      flex-shrink: 0;
    }

    .display-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 6px;
      min-height: 18px;
      user-select: none;
      -webkit-user-select: none;
    }

    .display-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .display-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      opacity: 0.4;
    }

    .expression {
      font-size: 15px;
      color: var(--text-muted);
      min-height: 22px;
      text-align: right;
      word-break: break-all;
      font-weight: 500;
      letter-spacing: 0.02em;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    .result {
      font-size: 42px;
      font-weight: 700;
      text-align: right;
      margin-top: 6px;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
      transition: color 0.15s;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
      /* input reset */
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      padding: 0;
      -moz-appearance: textfield;
    }

    .result::-webkit-outer-spin-button,
    .result::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .result.error {
      color: var(--danger);
      font-size: 28px;
    }

    /* Mode tabs */
    .mode-tabs {
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
      flex-shrink: 0;
    }

    .mode-tab {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
    }

    .mode-tab.active {
      background: rgba(57, 208, 192, 0.12);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 0 1px rgba(57, 208, 192, 0.2), 0 0 16px var(--accent-glow);
    }

    .mode-tab:active {
      transform: scale(0.97);
    }

    /* Keypad */
    .keypad-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px 12px;
      min-height: 0;
      overflow: hidden;
    }

    .keypad {
      display: grid;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    .keypad.basic {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }

    .keypad.scientific {
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(7, 1fr);
    }

    .key {
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      min-height: 0;
    }

    .key:active {
      transform: scale(0.94);
    }

    .key.num {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .key.num:hover {
      background: var(--surface-3);
    }

    .key.op {
      background: var(--surface);
      color: var(--accent-cyan);
      border: 1px solid rgba(57, 208, 192, 0.25);
    }

    .key.op:hover {
      background: rgba(57, 208, 192, 0.1);
    }

    .key.fn {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }

    .key.fn:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .key.equals {
      background: linear-gradient(135deg, #2ea043, #39d0c0);
      color: #0d1117;
      border: none;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(57, 208, 192, 0.3);
    }

    .key.equals:hover {
      filter: brightness(1.08);
    }

    .key.clear {
      background: rgba(248, 81, 73, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 81, 73, 0.3);
      font-size: 15px;
    }

    .key.clear:hover {
      background: rgba(248, 81, 73, 0.2);
    }

    .key.zero {
      grid-column: span 2;
    }

    .key.span2 {
      grid-column: span 2;
    }

    /* History panel */
    .history-panel {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .history-panel.open {
      transform: translateY(0);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .history-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    .history-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      user-select: none;
      -webkit-user-select: none;
    }

    .history-btn:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .history-btn.danger {
      color: var(--danger);
      border-color: rgba(248, 81, 73, 0.3);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .history-item:hover {
      border-color: var(--accent-cyan);
    }

    .history-item .h-expr {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .history-item .h-result {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 48px 20px;
      font-size: 14px;
    }

    /* Bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-top: none;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 6px 12px;
      border-radius: 10px;
      transition: color 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }

    .nav-item.active {
      color: var(--accent-cyan);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    /* Memory indicator */
    .mem-indicator {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      opacity: 0;
      transition: opacity 0.2s;
      letter-spacing: 0.04em;
    }

    .mem-indicator.show {
      opacity: 1;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.25s;
      z-index: 50;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Angle mode badge */
    .angle-mode {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-left: auto;
    }

    /* Memory help overlay */
    #memHelp {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      padding: 20px;
    }

    #memHelp.show {
      opacity: 1;
    }

    .mem-help-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 20px 18px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(12px);
      transition: transform 0.2s;
    }

    #memHelp.show .mem-help-card {
      transform: translateY(0);
    }

    .mem-help-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .mem-help-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .mem-help-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
    }

    .mem-help-row:last-of-type {
      border-bottom: none;
    }

    .mem-help-key {
      flex-shrink: 0;
      min-width: 58px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(57, 208, 192, 0.12);
      border: 1px solid rgba(57, 208, 192, 0.3);
      color: var(--accent-cyan);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .mem-help-hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .mem-help-hint b {
      color: var(--accent-cyan);
    }

    .mem-help-close {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2ea043, #39d0c0);
      color: #0d1117;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .mem-help-close:active {
      transform: scale(0.98);
    }

    /* Calculator long-press help */
    .calc-help-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 110;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      padding: 20px;
    }
    .calc-help-overlay.show { opacity: 1; }
    .calc-help-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 18px 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .calc-help-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-bottom: 8px;
    }
    .calc-help-body {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 14px;
    }
    .calc-help-actions {
      display: flex;
      gap: 8px;
    }
    .calc-help-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(57, 208, 192, 0.35);
      background: rgba(57, 208, 192, 0.12);
      color: var(--accent-cyan);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .calc-help-actions button.secondary {
      border-color: var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .calc-help-actions button:active { transform: scale(0.97); }

    /* Easter egg flash text */
    .egg-flash {
      position: fixed;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      font-size: 48px;
      font-weight: 800;
      color: var(--accent-cyan);
      text-shadow: 0 0 24px var(--accent-glow), 0 0 48px rgba(57, 208, 192, 0.4);
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
      letter-spacing: 0.04em;
    }

    .egg-flash.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .egg-flash.hide {
      opacity: 0;
      transform: translate(-50%, -60%) scale(1.15);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* ── Game mode ── */
    .bank-bar {
      display: none;
      gap: 6px;
      padding: 6px 16px 0;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
      /* Reserve height so rapid number changes never reflow the page */
      min-height: 52px;
      align-items: stretch;
    }
    body.game-mode .bank-bar,
    .game-mode .bank-bar { display: flex; }

    .bank-chip {
      flex: 1 1 0;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      transition: border-color 0.15s, background 0.15s;
      overflow: hidden;
    }
    .bank-chip .bank-val {
      display: block;
      font-size: 13px;
      color: var(--accent-cyan);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 1.2em;
    }
    .bank-chip.bust {
      border-color: var(--danger);
      background: rgba(248, 81, 73, 0.15);
    }

    body.game-mode .mode-tabs,
    .game-mode .mode-tabs { display: none; }
    body.game-mode .header-title span::after,
    .game-mode .header-title span::after {
      content: ' · GAME';
      color: var(--accent-cyan);
      font-size: 14px;
    }

    .key.locked {
      opacity: 0.35;
      filter: grayscale(0.6);
      pointer-events: none;
    }
    body.game-mode .key.fn,
    body.game-mode .key.op:not([data-action="+"]),
    body.game-mode .key.equals,
    body.game-mode .key.clear,
    .game-mode .key.fn,
    .game-mode .key.op:not([data-action="+"]),
    .game-mode .key.equals,
    .game-mode .key.clear {
      opacity: 0.35;
      pointer-events: none;
    }
    body.game-mode .key.op,
    .game-mode .key.op {
      opacity: 0.35;
      pointer-events: none;
    }

    .game-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      padding: 12px 16px;
      overflow-y: auto;
    }
    .game-panel.active { display: flex; }

    body.game-mode .keypad-wrap.hidden-by-game,
    .game-mode .keypad-wrap.hidden-by-game { display: none; }
    body.game-mode .display-wrap.dim-in-boss,
    .game-mode .display-wrap.dim-in-boss { opacity: 0.5; pointer-events: none; }

    /* Boss */
    .boss-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .boss-hearts {
      display: flex;
      gap: 8px;
      font-size: 28px;
    }
    .boss-hearts .heart { opacity: 0.25; transition: opacity 0.2s, transform 0.2s; }
    .boss-hearts .heart.alive { opacity: 1; }
    .boss-hearts .heart.hit { transform: scale(1.3); color: var(--danger); }

    .boss-placeholder {
      width: 192px;
      height: 192px;
      border-radius: 16px;
      background: #0a0e14;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .boss-placeholder.dead {
      filter: grayscale(1) brightness(0.55);
      opacity: 0.7;
    }
    .boss-placeholder.hit {
      animation: boss-shake 0.35s ease;
    }
    @keyframes boss-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .boss-sprite {

    /* Idle wing-flap using open-wing frames + a couple mid frames */
    .boss-sprite.idle {
      animation: dragon-idle 0.8s steps(1) infinite;
    }
    @keyframes dragon-idle {
      0%      { background-position: 0px 0px; }
      12.5%   { background-position: -256px 0px; }
      25%     { background-position: -512px 0px; }
      37.5%   { background-position: -768px 0px; }
      50%     { background-position: 0px -256px; }
      62.5%   { background-position: -256px -256px; }
      75%     { background-position: -512px -512px; }
      87.5%   { background-position: -768px -512px; }
      100%    { background-position: 0px 0px; }
    }
    .boss-sprite.hurt {
      animation: none;
      background-position: 0px -512px;
    }
    .boss-sprite.dead-pose {
      animation: none;
      background-position: -256px -768px;
    }

    .boss-cost {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .boss-cost strong { color: var(--accent-cyan); font-size: 18px; }

    .boss-attack-btn {
      width: 100%;
      max-width: 280px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #2ea043, #39d0c0);
      color: #0d1117;
      box-shadow: 0 4px 16px rgba(57, 208, 192, 0.3);
      user-select: none;
      transition: filter 0.15s, transform 0.08s, opacity 0.15s;
    }
    .boss-attack-btn:active { transform: scale(0.96); }
    .boss-attack-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.5);
      box-shadow: none;
    }
    .boss-kill-test {
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px dashed rgba(248, 81, 73, 0.5);
      background: rgba(248, 81, 73, 0.1);
      color: var(--danger);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .boss-kill-test:active { transform: scale(0.96); }
    .boss-victory {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent-cyan);
      text-align: center;
      text-shadow: 0 0 20px var(--accent-glow);
      animation: victory-pulse 1.2s ease-in-out infinite;
    }
    @keyframes victory-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }

    .boss-placeholder.roaring {
      animation: boss-roar 0.15s ease-in-out infinite;
    }
    @keyframes boss-roar {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-6px, 3px) rotate(-2deg); }
      50% { transform: translate(6px, -2px) rotate(2deg); }
      75% { transform: translate(-4px, -3px) rotate(-1deg); }
    }

    .sparkle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px #39d0c0, 0 0 16px #a3e635;
      animation: sparkle-fly 1.2s ease-out forwards;
    }
    @keyframes sparkle-fly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
    }

    .victory-overlay {
      position: fixed;
      inset: 0;
      z-index: 160;
      pointer-events: none;
      background: radial-gradient(circle at 50% 40%, rgba(57,208,192,0.15), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .victory-overlay.show { opacity: 1; }

    /* Post-victory wipe back to calculator */
    #gameWipeRoot {
      position: fixed;
      inset: 0;
      z-index: 300;
      pointer-events: none;
      /* Transparent so clipped regions show the live calculator underneath */
      background: transparent;
    }
    .game-wipe-surface {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
      will-change: clip-path;
    }
    .game-wipe-clone {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
      pointer-events: none;
      box-sizing: border-box;
    }
    .game-wipe-clone > .header,
    .game-wipe-clone > .bank-bar,
    .game-wipe-clone > .display-wrap,
    .game-wipe-clone > .mode-tabs,
    .game-wipe-clone > .bottom-nav {
      flex-shrink: 0;
    }
    .game-wipe-clone > .keypad-wrap,
    .game-wipe-clone > .game-panel.active {
      flex: 1 1 auto;
      min-height: 0;
    }
    .game-wipe-clone > .game-panel:not(.active) {
      display: none !important;
    }
    .game-wipe-clone > .keypad-wrap.hidden-by-game {
      display: none !important;
    }
    .game-wipe-clone * {
      animation: none !important;
      transition: none !important;
    }
    .game-wipe-bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      margin-top: -2px;
      background: linear-gradient(90deg, transparent, #39d0c0, #a3e635, #39d0c0, transparent);
      box-shadow: 0 0 12px rgba(57, 208, 192, 0.8), 0 0 24px rgba(163, 230, 53, 0.4);
      z-index: 2;
    }

    /* Upgrades */
    .upgrade-list { display: flex; flex-direction: column; gap: 10px; }
    .upgrade-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .upgrade-card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }
    .upgrade-card p {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .upgrade-card .up-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .upgrade-card .up-cost {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
    }
    .upgrade-card button {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(57, 208, 192, 0.35);
      background: rgba(57, 208, 192, 0.12);
      color: var(--accent-cyan);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .upgrade-card button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .upgrade-card button:active:not(:disabled) { transform: scale(0.96); }

    /* Assign auto-clicker picker */
    .assign-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 120;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .assign-overlay.show { opacity: 1; }
    .assign-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
    }
    .assign-card h3 { font-size: 16px; margin-bottom: 12px; }
    .assign-nums {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .assign-nums button {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .assign-nums button:active { transform: scale(0.94); }

    /* Screen flash on bust */
    .bust-flash {
      position: fixed;
      inset: 0;
      background: rgba(248, 81, 73, 0.35);
      z-index: 150;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .bust-flash.show { opacity: 1; }

    /* Quit confirm */
    .quit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 130;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .quit-overlay.show { opacity: 1; }
    .quit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .quit-card h3 { font-size: 18px; margin-bottom: 8px; }
    .quit-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }
    .quit-actions { display: flex; gap: 8px; }
    .quit-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }
    .quit-actions button.danger {
      background: rgba(248, 81, 73, 0.15);
      border-color: rgba(248, 81, 73, 0.4);
      color: var(--danger);
    }

    body.game-mode .nav-calc-only,
    .game-mode .nav-calc-only { display: none !important; }
    body:not(.game-mode) .nav-game-only { display: none !important; }
    /* Snapshot clone is always treated as game-mode for nav */
    .game-wipe-clone .nav-calc-only { display: none !important; }
    .game-wipe-clone .nav-game-only { display: flex !important; }

    .nav-item small {
      font-size: 9px;
      opacity: 0.7;
    }

    /* Responsive tweaks */
    @media (max-height: 700px) {
      .result { font-size: 34px; }
      .key { font-size: 17px; }
      .key.fn { font-size: 12px; }
    }

    @media (min-width: 481px) {
      body {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        box-shadow: 0 0 60px rgba(0,0,0,0.5);
      }
    }

    /* ── Tutorial / Sir Sum ── */
    .tutorial-overlay {
      position: fixed;
      inset: 0;
      z-index: 250;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 72px 16px 24px;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .tutorial-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .tutorial-stage {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding-top: 150px; /* room for larger Sir Sum above the card */
    }
    .tutorial-card {
      position: relative;
      z-index: 2;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .tutorial-portrait {
      position: absolute;
      right: 28px; /* shifted left */
      /* Legs behind card; head + torso clearly above */
      bottom: 72px; /* moved up */
      width: 210px;
      height: 320px; /* larger */
      z-index: 1;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      pointer-events: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      overflow: visible;
    }
    .tutorial-portrait img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
      background: transparent !important;
      filter:
        drop-shadow(0 0 2px rgba(200, 235, 255, 0.55))
        drop-shadow(0 0 6px rgba(120, 200, 255, 0.3))
        drop-shadow(0 3px 8px rgba(0, 0, 0, 0.4));
    }
    .tutorial-body {
      position: relative;
      z-index: 2;
      min-width: 0;
    }
    .tutorial-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .tutorial-text {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 14px;
      white-space: pre-line;
      padding-right: 100px; /* keep copy clear of Sir Sum on the right */
    }
    .tutorial-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tutorial-actions button {
      flex: 1;
      min-width: 110px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(57, 208, 192, 0.35);
      background: rgba(57, 208, 192, 0.12);
      color: var(--accent-cyan);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .tutorial-actions button.secondary {
      border-color: var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .tutorial-actions button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-title">
      CALC

    </div>
  </header>

  <!-- Top nav -->
  <nav class="bottom-nav">

    <button class="nav-item active nav-calc-only" id="navCalc">

      Boss
    </button>
    <button class="nav-item nav-game-only" id="navUpgrades" data-game-tab="upgrades">

      Quit

  </nav>

  <!-- Game bank bar -->
  <div class="bank-bar" id="bankBar"></div>

  <!-- Display -->
  <div class="display-wrap" id="displayWrap">
    <div class="display-meta">
      <span class="mem-indicator" id="memIndicator">M</span>
      <span class="angle-mode" id="angleMode">DEG</span>
    </div>
    <div class="display-card">
      <div class="expression" id="expression"></div>
      <input class="result" id="result" type="text" inputmode="decimal" value="0" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="basic" id="tabBasic">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
      Basic
    </button>
    <button class="mode-tab" data-mode="scientific" id="tabSci">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 012-2h12a2 2 0 012 2v14"/><path d="M8 9h8M8 13h5"/></svg>
      Scientific
    </button>
  </div>

  <!-- Keypad -->
  <div class="keypad-wrap" id="keypadWrap">
    <div class="keypad basic" id="keypad"></div>
  </div>

  <!-- Game: Boss panel -->
  <div class="game-panel" id="panelBoss">
    <div class="boss-area">
      <div class="boss-hearts" id="bossHearts"></div>
      <div class="boss-placeholder" id="bossSprite">
        <div class="boss-sprite idle" id="bossSpriteInner"></div>
      </div>
      <div class="boss-cost">Attack cost: <strong id="bossCost">300</strong></div>
      <button class="boss-attack-btn" id="bossAttackBtn" disabled>ATTACK</button>
      <button class="boss-kill-test" id="bossKillTest" type="button">KILL (test)</button>
      <div class="boss-victory" id="bossVictory" style="display:none">Dragon defeated!</div>
    </div>
  </div>

  <!-- Game: Upgrades panel -->
  <div class="game-panel" id="panelUpgrades">
    <div class="upgrade-list" id="upgradeList"></div>
  </div>

  <!-- History Panel -->
  <div class="history-panel" id="historyPanel">
    <div class="history-header">
      <h2>History</h2>
      <div class="history-actions">
        <button class="history-btn danger" id="clearHistory">Clear</button>
        <button class="history-btn" id="closeHistory">Done</button>
      </div>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">No calculations yet</div>

      { label: '⌫', type: 'fn', action: 'backspace' },
      { label: '%', type: 'fn', action: 'percent' },
      { label: '÷', type: 'op', action: '÷' },
      { label: '×', type: 'op', action: '×' },
      { label: '7', type: 'num', action: '7' },
      { label: '8', type: 'num', action: '8' },
      { label: '9', type: 'num', action: '9' },
      { label: '−', type: 'op', action: '−' },
      { label: '+', type: 'op', action: '+' },
      { label: '4', type: 'num', action: '4' },
      { label: '5', type: 'num', action: '5' },
      { label: '6', type: 'num', action: '6' },

      { label: '.', type: 'num', action: '.' },
    ];

    // ─────────────────────────────────────────────
    // Render keypad
    // ─────────────────────────────────────────────
    function renderKeypad() {
      // Force basic layout in game mode
      const keys = (game.active || mode === 'basic') ? basicKeys : sciKeys;
      keypadEl.className = `keypad ${game.active ? 'basic' : mode}`;
      keypadEl.innerHTML = keys.map(k => {
        const extra = k.id ? `id="${k.id}"` : '';
        let locked = '';
        if (game.active && /^[0-9]$/.test(k.action)) {
          const val = parseInt(k.action, 10);
          if (!game.unlocked.has(val)) locked = ' locked';
        }
        return `<button class="key ${k.type}${locked}" data-action="${k.action}" ${extra}>${k.label}</button>`;
      }).join('');

      // Update DEG button label
      const degBtn = document.getElementById('degBtn');
      if (degBtn) degBtn.textContent = isDeg ? 'DEG' : 'RAD';
    }

    // ─────────────────────────────────────────────
    // Display helpers
    // ─────────────────────────────────────────────
    // Easter-egg flash overlays (exact number string → message)
    // Matched against the raw display value (commas stripped). Leading zeros matter.
    const easterEggs = {
      '1337': 'lol',
      '0.7734': 'Hi',
      '07734': 'Hi',
      '7734': 'Heaven',
      '5318008': 'Nice',
      '58008': 'Nice.',
      '8008': 'Nice!',
      '80085': 'Nice!!',
      '8008135': 'Nice!!!',
      '0.71077345': 'Shell oil',
      '0.07734': 'Sup',
      '35007': 'Sturdy',
      '707': 'ROFL',
      '0.08': 'AGH!!',
      '0.1134': 'Hi',
      '618': 'Small',
      '55378008': ":'(",
      '32045': 'Shoe',
      '0.7105': 'Dirt',
      '0.771': 'Well',
    };
    let lastEggKey = null; // prevents re-flashing the same number until it changes

    function checkEasterEgg() {
      const key = String(displayValue).replace(/,/g, '').trim();

      if (easterEggs[key]) {
        if (lastEggKey !== key) {
          lastEggKey = key;
          flashOverlay(easterEggs[key]);
        }
      } else {
        lastEggKey = null;
      }
    }

    function flashOverlay(text) {
      const el = document.createElement('div');
      el.className = 'egg-flash';
      el.textContent = text;
      document.body.appendChild(el);
      // trigger animation
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        el.classList.add('hide');
        setTimeout(() => el.remove(), 400);
      }, 900);
    }

    function updateDisplay() {
      expressionEl.textContent = expression;
      // Don't overwrite while the user is actively typing/pasting in the field
      if (document.activeElement !== resultEl) {
        // While entering a number, show the raw string so trailing zeros after "." stay visible
        // (formatNumber would turn "0.00" into "0"). Only format completed results.
        if (displayValue === 'Error') {
          resultEl.value = 'Error';
        } else if (justEvaluated) {
          resultEl.value = formatNumber(displayValue);
        } else {
          resultEl.value = displayValue;
        }
      } else {
        resultEl.value = displayValue;
      }
      resultEl.classList.toggle('error', displayValue === 'Error');
      memIndicator.classList.toggle('show', hasMemory);
      angleModeEl.textContent = isDeg ? 'DEG' : 'RAD';
      document.getElementById('degLabel').textContent = isDeg ? 'DEG' : 'RAD';
      checkEasterEgg();
    }

    function syncFromInput() {
      let raw = resultEl.value.trim();
      // Allow intermediate states while typing: "", "-", ".", "-.", "1.", etc.
      if (raw === '' || raw === '-' || raw === '.' || raw === '-.') {
        displayValue = raw === '' ? '0' : raw;
        justEvaluated = false;
        lastEggKey = null;
        return;
      }
      // Strip thousand separators if pasted
      raw = raw.replace(/,/g, '');
      // Accept numbers, optional leading minus, optional decimal, optional scientific notation
      if (/^-?\d*\.?\d*(e[+-]?\d*)?$/i.test(raw)) {
        displayValue = raw;
        justEvaluated = false;
        checkEasterEgg();
      } else {
        // Invalid paste — revert to last good value
        resultEl.value = displayValue;
      }
    }

    function formatNumber(val) {
      if (val === 'Error' || val === 'Infinity' || val === '-Infinity') return val;
      const num = parseFloat(val);
      if (isNaN(num)) return val;
      // Use scientific notation for very large/small
      if (Math.abs(num) >= 1e12 || (Math.abs(num) < 1e-6 && num !== 0)) {
        return num.toExponential(6).replace(/\.?0+e/, 'e');
      }
      // Limit decimal places for display
      const str = num.toString();
      if (str.includes('e')) return str;
      if (str.includes('.')) {
        const [int, dec] = str.split('.');
        if (dec.length > 10) return num.toFixed(10).replace(/\.?0+$/, '');
      }
      // Add thousand separators for large integers
      if (Math.abs(num) >= 1000 && Number.isInteger(num)) {
        return num.toLocaleString('en-US');
      }
      return str;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
      if (typeof sfxToast === 'function' && game && game.active) sfxToast();
    }

    // ─────────────────────────────────────────────
    // Web Audio — SFX + chiptune boss music
    // (Original synth battle theme — not a copy of any commercial track)
    // ─────────────────────────────────────────────
    const AudioFX = (() => {
      let ctx = null;
      let musicPlaying = false;
      let musicTimer = null;
      let step = 0;
      let droneStarted = false;
      let droneNodes = []; // continuous oscillators to stop later

      function ensure() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function tone(freq, dur, type, vol, when) {
        const c = ensure();
        const t0 = (when != null ? when : c.currentTime);
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type || 'square';
        o.frequency.value = freq;
        g.gain.setValueAtTime(Math.max(vol, 0.0001), t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g);
        g.connect(c.destination);
        o.start(t0);
        o.stop(t0 + dur + 0.02);
      }

      function noise(dur, vol, when) {
        const c = ensure();
        const t0 = when != null ? when : c.currentTime;
        const buf = c.createBuffer(1, Math.max(1, Math.floor(c.sampleRate * dur)), c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        const g = c.createGain();
        g.gain.setValueAtTime(Math.max(vol, 0.0001), t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        src.connect(g);
        g.connect(c.destination);
        src.start(t0);
        src.stop(t0 + dur + 0.02);
      }

      function stopDrone() {
        const c = ctx;
        const t = c ? c.currentTime : 0;
        droneNodes.forEach(({ osc, gain, lfo }) => {
          try {
            gain.gain.cancelScheduledValues(t);
            const v = Math.max(gain.gain.value, 0.001);
            gain.gain.setValueAtTime(v, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
            osc.stop(t + 0.55);
            if (lfo) lfo.stop(t + 0.55);
          } catch (_) {}
        });
        droneNodes = [];
        droneStarted = false;
      }

      function startDrone() {
        if (droneStarted || !musicPlaying) return;
        droneStarted = true;
        const c = ensure();
        const t0 = c.currentTime;

        // Louder sustained pad — clearly audible under the lead
        const parts = [
          { freq: 55, type: 'sawtooth', vol: 0.09 },
          { freq: 82.4, type: 'triangle', vol: 0.07 },
          { freq: 110, type: 'sine', vol: 0.06 },
          { freq: 164.8, type: 'triangle', vol: 0.035 },
        ];
        parts.forEach(({ freq, type, vol }) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          const filter = c.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 420;
          filter.Q.value = 0.7;
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, t0);
          gain.gain.linearRampToValueAtTime(vol, t0 + 1.2);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(c.destination);
          osc.start(t0);
          droneNodes.push({ osc, gain, lfo: null });
        });
      }

      return {
        unlock() { ensure(); },
        // Manual button press — short tactile blip
        tap() {
          const c = ensure();
          const t0 = c.currentTime;
          tone(720, 0.035, 'square', 0.07, t0);
          tone(1080, 0.025, 'square', 0.035, t0 + 0.018);
        },
        click() {
          tone(880, 0.04, 'square', 0.06);
          tone(1320, 0.03, 'square', 0.03, ensure().currentTime + 0.02);
        },
        toast() {
          tone(660, 0.06, 'triangle', 0.08);
          tone(990, 0.08, 'triangle', 0.05, ensure().currentTime + 0.05);
        },
        buy() {
          tone(523, 0.07, 'square', 0.08);
          tone(659, 0.07, 'square', 0.07, ensure().currentTime + 0.07);
          tone(784, 0.12, 'square', 0.09, ensure().currentTime + 0.14);
        },
        bust() {
          tone(200, 0.15, 'sawtooth', 0.1);
          tone(120, 0.25, 'sawtooth', 0.08, ensure().currentTime + 0.1);
          noise(0.2, 0.06);
        },
        hit() {
          noise(0.08, 0.12);
          tone(180, 0.12, 'sawtooth', 0.1);
          tone(90, 0.2, 'square', 0.06, ensure().currentTime + 0.05);
        },
        roar() {
          const c = ensure();
          const t0 = c.currentTime;
          for (let i = 0; i < 8; i++) {
            tone(140 - i * 12, 0.18, 'sawtooth', 0.1 - i * 0.008, t0 + i * 0.08);
          }
          noise(0.6, 0.08, t0);
          noise(0.4, 0.06, t0 + 0.3);
        },
        victory() {
          const c = ensure();
          const t0 = c.currentTime;
          const notes = [523, 659, 784, 1047, 784, 1047, 1319];
          notes.forEach((f, i) => tone(f, 0.2, 'square', 0.1, t0 + i * 0.12));
          tone(1568, 0.5, 'triangle', 0.08, t0 + 0.9);
        },
        startMusic() {
          if (musicPlaying) return;
          ensure();
          musicPlaying = true;
          step = 0;
          droneStarted = false;
          stopDrone();
          // Tempo ~150 BPM, 16th notes → 100ms
          const beat = 0.1;
          const loopLen = 32; // steps per loop
          const phaseLoops = 2; // each phase lasts 2 loops (~6.4s)
          // phase = 0..3 based on how many loops completed

          // Phase 1 — sparse intro lead
          const lead1 = [
            440, 0, 0, 440, 523, 0, 0, 0,
            392, 0, 0, 392, 440, 0, 0, 0,
            349, 0, 0, 349, 392, 0, 0, 0,
            330, 0, 0, 349, 392, 0, 440, 0,
          ];
          const bass1 = [
            110, 0, 0, 0, 110, 0, 0, 0,
            98, 0, 0, 0, 98, 0, 0, 0,
            87.3, 0, 0, 0, 87.3, 0, 0, 0,
            82.4, 0, 0, 0, 110, 0, 0, 0,
          ];

          // Phase 2 — full riff + light hats
          const lead2 = [
            440, 0, 523, 440, 587, 0, 523, 440,
            392, 0, 440, 392, 523, 0, 440, 392,
            349, 0, 392, 349, 440, 0, 392, 349,
            330, 0, 349, 392, 440, 523, 587, 0,
          ];
          const bass2 = [
            110, 110, 0, 110, 130.8, 130.8, 0, 130.8,
            98, 98, 0, 98, 110, 110, 0, 110,
            87.3, 87.3, 0, 87.3, 98, 98, 0, 98,
            82.4, 82.4, 0, 82.4, 110, 0, 130.8, 0,
          ];

          // Phase 3 — counter-melody + four-on-the-floor
          const back3 = [
            220, 0, 0, 220, 262, 0, 220, 0,
            196, 0, 0, 196, 220, 0, 196, 0,
            175, 0, 0, 175, 196, 0, 175, 0,
            165, 0, 175, 196, 220, 0, 262, 0,
          ];

          // Phase 4 — aggressive double-time feel + high stabs
          const lead4 = [
            440, 523, 440, 587, 440, 523, 587, 659,
            392, 440, 392, 523, 392, 440, 523, 587,
            349, 392, 349, 440, 349, 392, 440, 523,
            330, 349, 392, 440, 523, 587, 659, 784,
          ];
          const stab4 = [
            0, 0, 0, 0, 880, 0, 0, 0,
            0, 0, 0, 0, 784, 0, 0, 0,
            0, 0, 0, 0, 698, 0, 0, 0,
            0, 0, 0, 0, 880, 0, 1047, 0,
          ];

          function tick() {
            if (!musicPlaying) return;
            const c = ensure();
            const t0 = c.currentTime;
            const i = step % loopLen;
            const phase = Math.min(3, Math.floor(step / (loopLen * phaseLoops)));

            // Pad comes in at phase 2
            if (!droneStarted && phase >= 2) startDrone();

            if (phase === 0) {
              // PHASE 1 — sparse, tension building
              if (lead1[i]) tone(lead1[i], beat * 1.1, 'square', 0.055, t0);
              if (bass1[i]) tone(bass1[i], beat * 1.2, 'triangle', 0.09, t0);
              if (i % 8 === 0) tone(55, 0.14, 'sine', 0.12, t0);
              if (i % 16 === 8) noise(0.06, 0.04, t0);
            } else if (phase === 1) {
              // PHASE 2 — main riff, light groove
              if (lead2[i]) tone(lead2[i], beat * 0.9, 'square', 0.05, t0);
              if (bass2[i]) tone(bass2[i], beat * 0.95, 'triangle', 0.08, t0);
              if (i % 2 === 0) noise(0.03, 0.03, t0);
              if (i % 4 === 0) tone(60, 0.1, 'sine', 0.12, t0);
              if (i % 8 === 4) noise(0.06, 0.06, t0);
            } else if (phase === 2) {
              // PHASE 3 — pad + counter-melody + driving beat
              if (lead2[i]) tone(lead2[i], beat * 0.9, 'square', 0.05, t0);
              if (bass2[i]) tone(bass2[i], beat * 0.95, 'triangle', 0.075, t0);
              if (back3[i]) tone(back3[i], beat * 1.1, 'triangle', 0.07, t0);
              if (i % 4 === 0) {
                tone(48, 0.16, 'sine', 0.16, t0);
                tone(80, 0.06, 'triangle', 0.06, t0);
              }
              if (i % 8 === 4) {
                noise(0.08, 0.11, t0);
                tone(200, 0.05, 'square', 0.05, t0);
              }
              if (i % 4 === 2) noise(0.04, 0.05, t0);
              if (i === 0) tone(90, 0.2, 'sine', 0.08, t0);
            } else {
              // PHASE 4 — climax: double-time lead, stabs, heavy drums
              if (lead4[i]) tone(lead4[i], beat * 0.7, 'square', 0.055, t0);
              if (bass2[i]) tone(bass2[i], beat * 0.9, 'triangle', 0.08, t0);
              if (back3[i]) tone(back3[i], beat * 1.0, 'triangle', 0.06, t0);
              if (stab4[i]) tone(stab4[i], beat * 0.5, 'square', 0.06, t0);
              // Double-time kicks
              if (i % 2 === 0) tone(50, 0.1, 'sine', 0.14, t0);
              if (i % 4 === 2) {
                noise(0.07, 0.1, t0);
                tone(180, 0.04, 'square', 0.05, t0);
              }
              if (i % 2 === 1) noise(0.025, 0.04, t0);
              if (i === 0 || i === 16) {
                tone(90, 0.18, 'sine', 0.1, t0);
                tone(120, 0.12, 'triangle', 0.06, t0 + 0.05);
              }
            }

            step++;
            // After phase 4, loop phase 3→4 (don't go back to sparse intro)
            if (step >= loopLen * phaseLoops * 4) {
              step = loopLen * phaseLoops * 2; // jump to start of phase 3
            }
            musicTimer = setTimeout(tick, beat * 1000);
          }
          tick();
        },
        stopMusic() {
          musicPlaying = false;
          if (musicTimer) {
            clearTimeout(musicTimer);
            musicTimer = null;
          }
          stopDrone();
        },
      };
    })();

    function sfxToast() { try { AudioFX.toast(); } catch (_) {} }

    // ─────────────────────────────────────────────
    // Math engine
    // ─────────────────────────────────────────────
    function toRad(x) { return isDeg ? x * Math.PI / 180 : x; }
    function fromRad(x) { return isDeg ? x * 180 / Math.PI : x; }

    function tokenize(expr) {
      const tokens = [];
      let i = 0;
      const s = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/π/g, Math.PI.toString()).replace(/e(?![0-9])/g, Math.E.toString());

      while (i < s.length) {
        if (/\s/.test(s[i])) { i++; continue; }

        // Numbers
        if (/[0-9.]/.test(s[i])) {
          let num = '';
          while (i < s.length && /[0-9.]/.test(s[i])) num += s[i++];
          tokens.push({ type: 'num', value: parseFloat(num) });
          continue;
        }

        // Functions
        const funcs = ['asin', 'acos', 'atan', 'sin', 'cos', 'tan', 'log', 'ln', 'sqrt'];
        let matched = false;
        for (const f of funcs) {
          if (s.slice(i, i + f.length) === f) {
            tokens.push({ type: 'fn', value: f });
            i += f.length;
            matched = true;
            break;
          }
        }
        if (matched) continue;

        // Operators & parens
        if ('+-*/^()'.includes(s[i])) {
          tokens.push({ type: 'op', value: s[i] });
          i++;
          continue;
        }

        i++; // skip unknown
      }
      return tokens;
    }

    function toRPN(tokens) {
      const output = [];
      const stack = [];
      const prec = { '+': 1, '-': 1, '*': 2, '/': 2, '^': 3 };
      const rightAssoc = { '^': true };

      for (const t of tokens) {
        if (t.type === 'num') {
          output.push(t);
        } else if (t.type === 'fn') {
          stack.push(t);
        } else if (t.value === '(') {
          stack.push(t);
        } else if (t.value === ')') {
          while (stack.length && stack[stack.length - 1].value !== '(') {
            output.push(stack.pop());
          }
          stack.pop(); // remove (
          if (stack.length && stack[stack.length - 1].type === 'fn') {
            output.push(stack.pop());
          }
        } else if (t.type === 'op') {
          while (
            stack.length &&
            stack[stack.length - 1].type === 'op' &&
            (rightAssoc[t.value]
              ? prec[t.value] < prec[stack[stack.length - 1].value]
              : prec[t.value] <= prec[stack[stack.length - 1].value])
          ) {
            output.push(stack.pop());
          }
          stack.push(t);
        }
      }
      while (stack.length) output.push(stack.pop());
      return output;
    }

    function evalRPN(rpn) {
      const stack = [];
      for (const t of rpn) {
        if (t.type === 'num') {
          stack.push(t.value);
        } else if (t.type === 'fn') {
          const a = stack.pop();
          if (a === undefined) throw new Error('Bad expression');
          let res;
          switch (t.value) {
            case 'sin': res = Math.sin(toRad(a)); break;
            case 'cos': res = Math.cos(toRad(a)); break;
            case 'tan': res = Math.tan(toRad(a)); break;
            case 'asin': res = fromRad(Math.asin(a)); break;
            case 'acos': res = fromRad(Math.acos(a)); break;
            case 'atan': res = fromRad(Math.atan(a)); break;
            case 'log': res = Math.log10(a); break;
            case 'ln': res = Math.log(a); break;
            case 'sqrt': res = Math.sqrt(a); break;
            default: throw new Error('Unknown fn');
          }
          if (!isFinite(res)) throw new Error('Math error');
          stack.push(res);
        } else if (t.type === 'op') {
          const b = stack.pop();
          const a = stack.pop();
          if (a === undefined || b === undefined) throw new Error('Bad expression');
          let res;
          switch (t.value) {
            case '+': res = a + b; break;
            case '-': res = a - b; break;
            case '*': res = a * b; break;
            case '/':
              if (b === 0) throw new Error('Div by zero');
              res = a / b;
              break;
            case '^': res = Math.pow(a, b); break;
            default: throw new Error('Unknown op');
          }
          if (!isFinite(res)) throw new Error('Math error');
          stack.push(res);
        }
      }
      if (stack.length !== 1) throw new Error('Bad expression');
      return stack[0];
    }

    function evaluate(expr) {
      if (!expr.trim()) return 0;
      // Handle implicit multiplication and unary minus
      let cleaned = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/π/g, `(${Math.PI})`)
        .replace(/(?<![a-z0-9.])e(?![0-9])/gi, `(${Math.E})`);

      // Insert * for implicit mult: 2(  or )(  or π2 etc already handled
      cleaned = cleaned.replace(/(\d|\))\s*\(/g, '$1*(');
      cleaned = cleaned.replace(/\)\s*(\d)/g, ')*$1');

      const tokens = tokenize(cleaned);
      const rpn = toRPN(tokens);
      return evalRPN(rpn);
    }

    // ─────────────────────────────────────────────
    // Actions
    // ─────────────────────────────────────────────
    // ─────────────────────────────────────────────
    // Mini-game state
    // ─────────────────────────────────────────────
    const game = {
      active: false,
      tab: 'gen',          // gen | boss | upgrades
      banks: [0],          // up to 4
      threshold: 50,
      unlocked: new Set([1]),
      autoClickers: {},    // digit string → count
      autoCost: 50,
      autoSpeed: 1,        // multiplier (1 = base 1000ms interval)
      autoSpeedCost: 500,  // first speed upgrade price
      bossHearts: 5,
      attackCost: 300,
      attacksDone: 0,
      autoTimer: null,
      won: false,
      // Partial payment progress toward upgrades (boss attacks do NOT use this)
      progress: {},        // key → points already paid
    };

    let plusStreak = 0;
    let plusStreakTimer = null;

    function notePlusTap() {
      if (game.active) return;
      plusStreak++;
      clearTimeout(plusStreakTimer);
      plusStreakTimer = setTimeout(() => { plusStreak = 0; }, 900);
      if (plusStreak >= 5) {
        plusStreak = 0;
        try { AudioFX.unlock(); } catch (_) {}
        enterGame();
      }
    }

    function numberUnlockCost(n) {
      // 2 → 75, 3 → 150, 4 → 300, ... doubles each time
      if (n < 2) return 0;
      return 75 * Math.pow(2, n - 2);
    }

    function totalPoints() {
      return game.banks.reduce((a, b) => a + b, 0);
    }

    function maxCapacity() {
      return game.threshold * game.banks.length;
    }

    function addPoints(amount) {
      if (amount <= 0 || game.won) return;
      // Distribute evenly across banks (round-robin 1 point at a time)
      let remaining = amount;
      let idx = 0;
      const startBanks = game.banks.slice();
      while (remaining > 0) {
        if (game.banks[idx] >= game.threshold) {
          // this bank full — try others
          let found = false;
          for (let i = 0; i < game.banks.length; i++) {
            if (game.banks[i] < game.threshold) {
              idx = i;
              found = true;
              break;
            }
          }
          if (!found) {
            // all full — any extra causes bust
            bustBanks();
            return;
          }
        }
        game.banks[idx] += 1;
        remaining--;
        idx = (idx + 1) % game.banks.length;
      }
      // Safety: if any bank somehow over, bust
      if (game.banks.some(b => b > game.threshold)) {
        bustBanks();
        return;
      }
      renderBanks();
      updateBossUI();
      renderUpgrades();
    }

    function bustBanks() {
      game.banks = game.banks.map(() => 0);
      renderBanks();
      const flash = document.getElementById('bustFlash');
      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 250);
      try { AudioFX.bust(); } catch (_) {}
      showToast('Bust! Over threshold — banks reset');
      updateBossUI();
      renderUpgrades();
    }

    function spendFromOneBank(cost) {
      // Boss attacks: must come from a single bank
      for (let i = 0; i < game.banks.length; i++) {
        if (game.banks[i] >= cost) {
          game.banks[i] -= cost;
          renderBanks();
          return true;
        }
      }
      return false;
    }

    // Drain points from any banks toward an amount (for upgrade partial payments)
    function spendAny(amount) {
      let need = amount;
      let spent = 0;
      for (let i = 0; i < game.banks.length && need > 0; i++) {
        const take = Math.min(game.banks[i], need);
        game.banks[i] -= take;
        need -= take;
        spent += take;
      }
      if (spent > 0) renderBanks();
      return spent;
    }

    function progressKey(type, extra) {
      if (type === 'unlock') return 'unlock_' + extra;
      if (type === 'auto') return 'auto_' + game.autoCost; // tied to current price tier
      if (type === 'speed') return 'speed_' + game.autoSpeedCost;
      if (type === 'threshold') return 'threshold_' + game.threshold;
      if (type === 'bank') return 'bank_' + game.banks.length;
      return type;
    }

    function nextSpeedCost(current) {
      // ×1.25, then round up to nearest 50
      return Math.ceil((current * 1.25) / 50) * 50;
    }

    function getProgress(key) {
      return game.progress[key] || 0;
    }

    function renderBanks() {
      const bar = document.getElementById('bankBar');
      bar.innerHTML = game.banks.map((v, i) => `
        <div class="bank-chip${v >= game.threshold ? ' bust' : ''}">
          Bank ${i + 1}
          <span class="bank-val">${v} / ${game.threshold}</span>
        </div>
      `).join('');
    }

    function renderTutorialStep() {

            tutorialStep = c.next;

    function hideTutorial() {
