    function enterGame() {
      game.active = true;
      game.tab = 'gen';
      game.banks = [0];
      game.threshold = 50;
      game.unlocked = new Set([1]);
      game.autoClickers = {};
      game.autoCost = 50;
      game.autoSpeed = 1;
      game.autoSpeedCost = 500;
      game.bossHearts = 5;
      game.attackCost = 300;
      game.attacksDone = 0;
      game.won = false;
      game.progress = {};
      document.body.classList.add('game-mode');
      showGameTab('gen');
      renderBanks();
      updateBossUI();
      renderUpgrades();
      renderKeypad();
      clearAll();
      startAutoClickers();
      try {
        AudioFX.unlock();
        AudioFX.startMusic();
      } catch (_) {}
      // In-character offer instead of a blunt prompt
      showTutorialOffer();
    }

    function exitGame(opts) {
      const silent = opts && opts.silent;
      game.active = false;
      hideTutorial();
      stopAutoClickers();
      try { AudioFX.stopMusic(); } catch (_) {}
      document.querySelectorAll('.victory-overlay, .sparkle-layer').forEach(el => el.remove());
      document.body.classList.remove('game-mode');
      document.getElementById('panelBoss').classList.remove('active');
      document.getElementById('panelUpgrades').classList.remove('active');
      document.getElementById('keypadWrap').classList.remove('hidden-by-game');
      document.getElementById('displayWrap').classList.remove('dim-in-boss');
      // restore calc nav active
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('navCalc').classList.add('active');
      renderKeypad();
      clearAll();
      if (!silent) showToast('Back to calculator');
    }

    function beginCalcWipeTransition() {
      // Remove any previous wipe
      const old = document.getElementById('gameWipeRoot');
      if (old) old.remove();

      const root = document.createElement('div');
      root.id = 'gameWipeRoot';
      root.innerHTML = `
        <div class="game-wipe-surface" id="gameWipeSurface"></div>
        <div class="game-wipe-bar" id="gameWipeBar"></div>
      `;
      document.body.appendChild(root);

      const surface = document.getElementById('gameWipeSurface');
      const bar = document.getElementById('gameWipeBar');

      // Capture current game UI — include game-mode class so CSS layout matches
      const cloneWrap = document.createElement('div');
      cloneWrap.className = 'game-wipe-clone game-mode';
      Array.from(document.body.children).forEach((child) => {
        if (child.id === 'gameWipeRoot') return;
        if (child.tagName === 'SCRIPT') return;
        if (child.id === 'toast') return;
        if (child.id === 'bustFlash') return;
        if (child.classList && child.classList.contains('victory-overlay')) return;
        if (child.id === 'memHelp' || child.id === 'assignOverlay' || child.id === 'quitOverlay') return;
        cloneWrap.appendChild(child.cloneNode(true));
      });
      surface.appendChild(cloneWrap);

      // Force boss panel visible in snapshot if it was the active tab
      // (clone keeps .active classes from the live DOM)

      // Restore calculator underneath while the frozen surface covers it
      exitGame({ silent: true });

      // Hard-hide any game panels on the live DOM so they can't peek through
      const liveBoss = document.getElementById('panelBoss');
      const liveUp = document.getElementById('panelUpgrades');
      if (liveBoss) liveBoss.classList.remove('active');
      if (liveUp) liveUp.classList.remove('active');

      // Wipe bar travels top → bottom; clip the surface so calculator is revealed
      const duration = 1400;
      const start = performance.now();
      bar.style.top = '0px';
      surface.style.clipPath = 'inset(0px 0 0 0)';

      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const h = root.clientHeight || window.innerHeight;
        const y = e * h;
        surface.style.clipPath = `inset(${y}px 0 0 0)`;
        bar.style.top = y + 'px';
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          root.remove();
          showToast('Back to calculator');
        }
      }
      requestAnimationFrame(frame);
    }

    function showGameTab(tab) {
      game.tab = tab;
      document.querySelectorAll('.nav-game-only').forEach(n => n.classList.remove('active'));
      const navId = { gen: 'navGen', boss: 'navBoss', upgrades: 'navUpgrades' }[tab];
      if (navId) document.getElementById(navId).classList.add('active');

      const bossPanel = document.getElementById('panelBoss');
      const upPanel = document.getElementById('panelUpgrades');
      const keypad = document.getElementById('keypadWrap');
      const display = document.getElementById('displayWrap');

      bossPanel.classList.remove('active');
      upPanel.classList.remove('active');
      keypad.classList.remove('hidden-by-game');
      display.classList.remove('dim-in-boss');

      if (tab === 'gen') {
        // keypad visible
      } else if (tab === 'boss') {
        keypad.classList.add('hidden-by-game');
        bossPanel.classList.add('active');
        updateBossUI();
      } else if (tab === 'upgrades') {
        keypad.classList.add('hidden-by-game');
        upPanel.classList.add('active');
        renderUpgrades();
      }
    }

    function updateBossUI() {
      const hearts = document.getElementById('bossHearts');
      hearts.innerHTML = [0,1,2,3,4].map(i =>
        `<span class="heart${i < game.bossHearts ? ' alive' : ''}">♥</span>`
      ).join('');
      document.getElementById('bossCost').textContent = game.attackCost;
      const btn = document.getElementById('bossAttackBtn');
      const canAfford = game.banks.some(b => b >= game.attackCost);
      btn.disabled = game.bossHearts <= 0 || !canAfford;
      const shell = document.getElementById('bossSprite');
      const inner = document.getElementById('bossSpriteInner');
      const victory = document.getElementById('bossVictory');
      if (game.bossHearts <= 0) {
        shell.classList.add('dead');
        if (inner) {
          inner.classList.remove('idle', 'hurt');
          inner.classList.add('dead-pose');
        }
        victory.style.display = 'block';
        btn.style.display = 'none';
      } else {
        shell.classList.remove('dead');
        if (inner && !inner.classList.contains('hurt')) {
          inner.classList.remove('dead-pose');
          inner.classList.add('idle');
        }
        victory.style.display = 'none';
        btn.style.display = '';
      }
    }

    function spawnSparkles(host, count) {
      let layer = host.querySelector('.sparkle-layer');
      if (!layer) {
        layer = document.createElement('div');
        layer.className = 'sparkle-layer';
        host.style.position = host.style.position || 'relative';
        host.appendChild(layer);
      }
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 100;
        s.style.left = (40 + Math.random() * 20) + '%';
        s.style.top = (40 + Math.random() * 20) + '%';
        s.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
        s.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
        s.style.animationDelay = (Math.random() * 0.4) + 's';
        layer.appendChild(s);
        setTimeout(() => s.remove(), 1400);
      }
    }

    function playVictorySequence() {
      // Freeze economy
      game.won = true;
      stopAutoClickers();
      game.autoClickers = {};
      try { AudioFX.stopMusic(); } catch (_) {}

      const shell = document.getElementById('bossSprite');
      const inner = document.getElementById('bossSpriteInner');
      const area = shell.parentElement;

      // Final roar + shake
      shell.classList.add('roaring');
      if (inner) {
        inner.classList.remove('idle');
        inner.classList.add('hurt');
      }
      try { AudioFX.roar(); } catch (_) {}

      // Sparkles burst
      const sparkleHost = document.getElementById('panelBoss') || document.body;
      let bursts = 0;
      const sparkleTimer = setInterval(() => {
        spawnSparkles(sparkleHost, 12);
        bursts++;
        if (bursts >= 8) clearInterval(sparkleTimer);
      }, 200);

      // Victory overlay glow
      let overlay = document.querySelector('.victory-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'victory-overlay';
        document.body.appendChild(overlay);
      }
      requestAnimationFrame(() => overlay.classList.add('show'));

      setTimeout(() => {
        shell.classList.remove('roaring');
        if (inner) {
          inner.classList.remove('hurt');
          inner.classList.add('dead-pose');
        }
        shell.classList.add('dead');
        try { AudioFX.victory(); } catch (_) {}
        showToast('VICTORY! Dragon defeated!');
        updateBossUI();
        renderUpgrades();
        renderKeypad();

        // Sir Sum congratulates, then wipe on dismiss
        setTimeout(() => {
          showVictoryCongrats(() => {
            beginCalcWipeTransition();
          });
        }, 900);
      }, 1800);
    }

    function doBossAttack() {
      if (game.bossHearts <= 0) return;
      if (!spendFromOneBank(game.attackCost)) {
        showToast('Need ' + game.attackCost + ' in a single bank');
        return;
      }
      game.bossHearts--;
      game.attacksDone++;
      game.attackCost *= 2;

      try { AudioFX.hit(); } catch (_) {}

      // Hit reaction on sprite
      const shell = document.getElementById('bossSprite');
      const inner = document.getElementById('bossSpriteInner');
      shell.classList.remove('hit');
      void shell.offsetWidth;
      shell.classList.add('hit');
      if (inner) {
        inner.classList.remove('idle');
        inner.classList.add('hurt');
        setTimeout(() => {
          if (game.bossHearts > 0 && inner) {
            inner.classList.remove('hurt');
            inner.classList.add('idle');
          }
        }, 400);
      }

      const hearts = document.querySelectorAll('#bossHearts .heart');
      if (hearts[game.bossHearts]) {
        hearts[game.bossHearts].classList.add('hit');
      }

      if (game.bossHearts <= 0) {
        playVictorySequence();
      } else {
        updateBossUI();
        renderUpgrades();
        showToast('Hit! Hearts left: ' + game.bossHearts);
      }
    }

    function costLabel(cost, key) {
      const paid = getProgress(key) || 0;
      // Always show contributed / total so partial payment is obvious
      return `${paid} / ${cost} pts`;
    }

    function renderUpgrades() {
      const list = document.getElementById('upgradeList');
      if (!list) return;

      let nextNum = null;
      for (let n = 2; n <= 9; n++) {
        if (!game.unlocked.has(n)) { nextNum = n; break; }
      }

      const autoCount = Object.values(game.autoClickers).reduce((a, b) => a + b, 0);
      const hasPoints = totalPoints() > 0;
      let html = '';

      // Unlock number — Buy always enabled if you have any points (partial OK)
      if (nextNum !== null) {
        const cost = numberUnlockCost(nextNum);
        const key = progressKey('unlock', nextNum);
        html += `
          <div class="upgrade-card">
            <h3>Unlock number ${nextNum}</h3>
            <p>Click ${nextNum} on Gen to earn ${nextNum} points per tap.</p>
            <div class="up-meta">
              <span class="up-cost">${costLabel(cost, key)}</span>
              <button data-up="unlock" data-n="${nextNum}" data-cost="${cost}" ${hasPoints ? '' : 'disabled'}>Buy</button>
            </div>
          </div>`;
      } else {
        html += `
          <div class="upgrade-card">
            <h3>All numbers unlocked</h3>
            <p>You can tap 1–9 on the Gen pad.</p>
          </div>`;
      }

      const autoKey = progressKey('auto');
      html += `
        <div class="upgrade-card">
          <h3>Auto-clicker</h3>
          <p>Automatically taps a number you choose. Owned: ${autoCount}. Cost doubles each buy.</p>
          <div class="up-meta">
            <span class="up-cost">${costLabel(game.autoCost, autoKey)}</span>
            <button data-up="auto" data-cost="${game.autoCost}" ${hasPoints ? '' : 'disabled'}>Buy</button>
          </div>
        </div>`;

      // Speed upgrade — appears after 5 auto-clickers owned
      if (autoCount >= 5) {
        const speedKey = progressKey('speed');
        html += `
          <div class="upgrade-card">
            <h3>Auto-clicker speed</h3>
            <p>Doubles auto-click rate. Current speed: ×${game.autoSpeed}</p>
            <div class="up-meta">
              <span class="up-cost">${costLabel(game.autoSpeedCost, speedKey)}</span>
              <button data-up="speed" data-cost="${game.autoSpeedCost}" ${hasPoints ? '' : 'disabled'}>Buy</button>
            </div>
          </div>`;
      }

      const threshCost = game.threshold * 3;
      const threshKey = progressKey('threshold');
      html += `
        <div class="upgrade-card">
          <h3>Raise threshold</h3>
          <p>Current max per bank: ${game.threshold}. Raises by +50.</p>
          <div class="up-meta">
            <span class="up-cost">${costLabel(threshCost, threshKey)}</span>
            <button data-up="threshold" data-cost="${threshCost}" ${hasPoints ? '' : 'disabled'}>Buy</button>
          </div>
        </div>`;

      if (game.banks.length < 4) {
        const bankCost = 100 * game.banks.length;
        const bankKey = progressKey('bank');
        html += `
          <div class="upgrade-card">
            <h3>Extra bank</h3>
            <p>Add another bank (same threshold). Points split across banks. ${game.banks.length}/4</p>
            <div class="up-meta">
              <span class="up-cost">${costLabel(bankCost, bankKey)}</span>
              <button data-up="bank" data-cost="${bankCost}" ${hasPoints ? '' : 'disabled'}>Buy</button>
            </div>
          </div>`;
      } else {
        html += `
          <div class="upgrade-card">
            <h3>Banks maxed</h3>
            <p>You have all 4 banks.</p>
          </div>`;
      }

      list.innerHTML = html;
    }

    function buyUpgrade(type, cost, extra) {
      const key = progressKey(type, extra);
      const already = getProgress(key);
      const remaining = Math.max(0, cost - already);
      if (remaining <= 0) return;

      const available = totalPoints();
      if (available <= 0) {
        showToast('No points to contribute');
        return;
      }

      const contributed = spendAny(Math.min(available, remaining));
      game.progress[key] = already + contributed;
      renderBanks();
      updateBossUI();

      if (game.progress[key] >= cost) {
        // Fully paid — grant upgrade and clear progress
        delete game.progress[key];
        try { AudioFX.buy(); } catch (_) {}
        if (type === 'unlock') {
          game.unlocked.add(parseInt(extra, 10));
          showToast('Unlocked ' + extra + '!');
          renderKeypad();
        } else if (type === 'auto') {
          promptAssignAuto();
          game.autoCost *= 2;
        } else if (type === 'speed') {
          game.autoSpeed *= 2;
          game.autoSpeedCost = nextSpeedCost(game.autoSpeedCost);
          startAutoClickers();
          showToast('Auto speed ×' + game.autoSpeed);
        } else if (type === 'threshold') {
          game.threshold += 50;
          showToast('Threshold now ' + game.threshold);
        } else if (type === 'bank') {
          game.banks.push(0);
          showToast('Bank ' + game.banks.length + ' added');
          renderBanks();
        }
      } else {
        try { AudioFX.click(); } catch (_) {}
        showToast('Contributed ' + contributed + ' — ' + game.progress[key] + ' / ' + cost);
      }
      renderUpgrades();
    }

    function promptAssignAuto() {
      const existing = document.getElementById('assignOverlay');
      if (existing) existing.remove();
      const nums = [...game.unlocked].sort((a, b) => a - b);
      const overlay = document.createElement('div');
      overlay.id = 'assignOverlay';
      overlay.className = 'assign-overlay';
      overlay.innerHTML = `
        <div class="assign-card">
          <h3>Assign auto-clicker to</h3>
          <div class="assign-nums">
            ${nums.map(n => `<button data-assign="${n}">${n}</button>`).join('')}
          </div>
          <button class="history-btn" id="assignCancel" style="width:100%">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));

      overlay.querySelectorAll('[data-assign]').forEach(btn => {
        btn.addEventListener('click', () => {
          const n = btn.dataset.assign;
          game.autoClickers[n] = (game.autoClickers[n] || 0) + 1;
          showToast('Auto-clicker → ' + n);
          overlay.remove();
          startAutoClickers();
          renderUpgrades();
        });
      });
      document.getElementById('assignCancel').addEventListener('click', () => {
        // refund? already spent — keep the clicker unassigned by refunding
        // Actually we already spent; assign to 1 by default if cancel
        game.autoClickers['1'] = (game.autoClickers['1'] || 0) + 1;
        showToast('Auto-clicker → 1');
        overlay.remove();
        startAutoClickers();
        renderUpgrades();
      });
    }

    function startAutoClickers() {
      stopAutoClickers();
      // Base interval 1000ms; each speed level halves it (×2 speed)
      const interval = Math.max(50, Math.round(1000 / game.autoSpeed));
      game.autoTimer = setInterval(() => {
        if (!game.active) return;
        for (const [digit, count] of Object.entries(game.autoClickers)) {
          for (let i = 0; i < count; i++) {
            gameTapDigit(digit);
          }
        }
      }, interval);
    }

    function stopAutoClickers() {
      if (game.autoTimer) {
        clearInterval(game.autoTimer);
        game.autoTimer = null;
      }
    }

    function gameTapDigit(digit, manual) {
      if (game.won) return;
      // Earn points equal to the digit value
      const val = parseInt(digit, 10);
      if (!game.unlocked.has(val)) return;
      if (manual) {
        try { AudioFX.tap(); } catch (_) {}
      }
      addPoints(val);
      // Also type into display
      if (justEvaluated) {
        expression = '';
        displayValue = '0';
        justEvaluated = false;
      }
      if (displayValue === '0') {
        displayValue = digit;
      } else {
        displayValue += digit;
      }
      // Prevent runaway string length from auto-clickers
      if (displayValue.length > 16) {
        displayValue = '0';
        expression = '';
      }
      updateDisplay();
    }

    function appendNum(n) {
      plusStreak = 0;
      if (game.active) {
        // Only allow unlocked digits
        if (/^[0-9]$/.test(n)) {
          const val = parseInt(n, 10);
          if (!game.unlocked.has(val)) {
            showToast('Number locked — buy it in Upgrades');
            return;
          }
          gameTapDigit(n, true); // manual press
          return;
        }
        // decimal etc ignored in game
        return;
      }
      if (justEvaluated) {
        expression = '';
        displayValue = '0';
        justEvaluated = false;
      }
      if (displayValue === '0' && n !== '.') {
        displayValue = n;
      } else if (n === '.' && displayValue.includes('.')) {
        return;
      } else {
        displayValue += n;
      }
      updateDisplay();
    }

    function appendOp(op) {
      if (op === '+') notePlusTap();
      else plusStreak = 0;

      // After pressing = : continue from the result  (e.g. 8 → + → "8+")
      if (justEvaluated) {
        expression = displayValue + op;
        displayValue = '0';
        justEvaluated = false;
        updateDisplay();
        return;
      }

      const endsWithOp = /[+\-×÷^]$/.test(expression.trim());

      // User is just swapping the pending operator (e.g. 5+ → 5×)
      if (endsWithOp && displayValue === '0') {
        expression = expression.trim().slice(0, -1) + op;
        updateDisplay();
        return;
      }

      // There is a pending operation AND a second number has been entered
      // → evaluate first, then chain the new operator onto the result
      // Example: 5+3 then press ×  →  becomes  8×
      if (expression && /[+\-×÷^]/.test(expression) && displayValue !== '0') {
        try {
          const toEval = expression + displayValue;
          const result = evaluate(toEval);
          const rounded = Math.round(result * 1e12) / 1e12;

          history.unshift({ expr: toEval, result: rounded });
          if (history.length > 50) history.pop();
          localStorage.setItem('calcHistory', JSON.stringify(history));

          expression = String(rounded) + op;
          displayValue = '0';
          updateDisplay();
          return;
        } catch (e) {
          // fall through
        }
      }

      // Fresh start or simple first operator
      if (!expression) {
        expression = displayValue + op;
      } else if (endsWithOp) {
        expression = expression.trim().slice(0, -1) + op;
      } else {
        expression = expression + displayValue + op;
      }
      displayValue = '0';
      updateDisplay();
    }

    function doEquals() {
      try {
        let full = expression;
        if (displayValue !== '0' || !expression) {
          full += displayValue;
        }
        if (!full.trim()) return;

        const result = evaluate(full);
        const rounded = Math.round(result * 1e12) / 1e12; // mitigate floating point

        // History
        history.unshift({ expr: full, result: rounded });
        if (history.length > 50) history.pop();
        localStorage.setItem('calcHistory', JSON.stringify(history));

        expression = full;
        displayValue = String(rounded);
        justEvaluated = true;
        updateDisplay();
      } catch (e) {
        displayValue = 'Error';
        justEvaluated = true;
        updateDisplay();
      }
    }

    function clearAll() {
      expression = '';
      displayValue = '0';
      justEvaluated = false;
      updateDisplay();
    }

    function backspace() {
      if (justEvaluated) {
        clearAll();
        return;
      }
      if (displayValue.length <= 1) {
        displayValue = '0';
      } else {
        displayValue = displayValue.slice(0, -1);
      }
      updateDisplay();
    }

    function negate() {
      if (displayValue === '0' || displayValue === 'Error') return;
      if (displayValue.startsWith('-')) {
        displayValue = displayValue.slice(1);
      } else {
        displayValue = '-' + displayValue;
      }
      updateDisplay();
    }

    function percent() {
      const n = parseFloat(displayValue);
      if (isNaN(n)) return;
      displayValue = String(n / 100);
      updateDisplay();
    }

    function applyUnary(fn) {
      try {
        const n = parseFloat(displayValue);
        if (isNaN(n)) return;
        let res;
        switch (fn) {
          case 'sin': res = Math.sin(toRad(n)); break;
          case 'cos': res = Math.cos(toRad(n)); break;
          case 'tan': res = Math.tan(toRad(n)); break;
          case 'log': res = Math.log10(n); break;
          case 'ln': res = Math.log(n); break;
          case 'sqrt': res = Math.sqrt(n); break;
          case 'sq': res = n * n; break;
          case 'inv':
            if (n === 0) throw new Error();
            res = 1 / n;
            break;
          default: return;
        }
        if (!isFinite(res)) throw new Error();
        const rounded = Math.round(res * 1e12) / 1e12;
        expression = `${fn}(${displayValue})`;
        displayValue = String(rounded);
        justEvaluated = true;
        history.unshift({ expr: expression, result: rounded });
        localStorage.setItem('calcHistory', JSON.stringify(history));
        updateDisplay();
      } catch {
        displayValue = 'Error';
        justEvaluated = true;
        updateDisplay();
      }
    }

    function insertConst(c) {
      if (justEvaluated) {
        expression = '';
        justEvaluated = false;
      }
      displayValue = c === 'π' ? String(Math.PI) : String(Math.E);
      updateDisplay();
    }

    function handleAction(action) {
      switch (action) {
        case 'clear': clearAll(); break;
        case 'backspace': backspace(); break;
        case 'negate': negate(); break;
        case 'percent': percent(); break;
        case '=': doEquals(); break;
        case '+': case '−': case '×': case '÷': case '^':
          appendOp(action); break;
        case 'sin': case 'cos': case 'tan': case 'log': case 'ln':
        case 'sqrt': case 'sq': case 'inv':
          applyUnary(action); break;
        case 'π': case 'e':
          insertConst(action); break;
        case '(':
          if (justEvaluated) { expression = ''; justEvaluated = false; }
          expression += (displayValue !== '0' ? displayValue : '') + '(';
          displayValue = '0';
          updateDisplay();
          break;
        case ')':
          expression += displayValue + ')';
          displayValue = '0';
          updateDisplay();
          break;
        case 'toggleDeg':
          isDeg = !isDeg;
          updateDisplay();
          renderKeypad();
          showToast(isDeg ? 'Degrees' : 'Radians');
          break;
        case '2nd':
          showToast('2nd functions coming soon');
          break;
        default:
          if (/^[0-9.]$/.test(action)) appendNum(action);
      }
    }

    function bindKeypadLongPress() {

        if (game.active) return;

        clearTimeout(helpLongPressTimer);
        helpLongPressTimer = setTimeout(() => {
          helpLongPressFired = true;
          showCalcHelp(btn.dataset.action, false);
        }, 450);
      });
      const cancelPress = () => {
        clearTimeout(helpLongPressTimer);
        pressBtn = null;

      keypadEl.addEventListener('pointerup', cancelPress);
      keypadEl.addEventListener('pointerleave', cancelPress);
      keypadEl.addEventListener('pointercancel', cancelPress);

        e.stopPropagation();

      if (!btn) return;
      handleAction(btn.dataset.action);

      requestAnimationFrame(() => overlay.classList.add('show'));
      const close = () => {
        overlay.classList.remove('show');
        setTimeout(() => overlay.remove(), 200);
      };
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      document.getElementById('memHelpClose').addEventListener('click', close);
    }

    navMem.addEventListener('pointerdown', (e) => {
      memLongPressed = false;
      memHoldTimer = setTimeout(() => {
        memLongPressed = true;
        // Cancel pending multi-tap
        clearTimeout(memTapTimer);
        memTapCount = 0;
        showMemoryHelp();
      }, 500);
    });

    navMem.addEventListener('pointerup', () => {
      clearTimeout(memHoldTimer);
    });

    navMem.addEventListener('pointerleave', () => {
      clearTimeout(memHoldTimer);
    });

    navMem.addEventListener('pointercancel', () => {
      clearTimeout(memHoldTimer);
    });

    navMem.addEventListener('click', () => {
      if (memLongPressed) {
        memLongPressed = false;
        return; // long-press already handled
      }
      memTapCount++;
      clearTimeout(memTapTimer);
      memTapTimer = setTimeout(() => {
        if (memTapCount === 1) memoryRecall();
        else if (memTapCount === 2) memoryStore();
        else if (memTapCount === 3) memoryAdd();
        else memoryClear();
        memTapCount = 0;
      }, 350);
    });

    document.getElementById('navDeg').addEventListener('click', () => {
      isDeg = !isDeg;
      updateDisplay();
      renderKeypad();
      showToast(isDeg ? 'Degrees mode' : 'Radians mode');
    });

    // Direct typing / paste into the number field
    resultEl.addEventListener('focus', () => {
      // Show the raw value for editing (not the formatted one)
      resultEl.value = displayValue === 'Error' ? '' : displayValue;
      // Select all so typing replaces, pasting is easy
      setTimeout(() => resultEl.select(), 0);
    });

    resultEl.addEventListener('input', () => {
      syncFromInput();
    });

    resultEl.addEventListener('paste', (e) => {
      // Let the paste happen, then clean it up on the next tick
      setTimeout(() => {
        let raw = resultEl.value.trim().replace(/,/g, '').replace(/\s/g, '');
        // Extract first valid number if extra junk was pasted
        const match = raw.match(/-?\d*\.?\d+(e[+-]?\d+)?/i);
        if (match) {
          displayValue = match[0];
          resultEl.value = displayValue;
          justEvaluated = false;
        } else {
          resultEl.value = displayValue;
        }
      }, 0);
    });

    resultEl.addEventListener('blur', () => {
      // Normalize empty / partial input
      if (displayValue === '' || displayValue === '-' || displayValue === '.' || displayValue === '-.') {
        displayValue = '0';
      }
      // Re-format on blur
      updateDisplay();
    });

    resultEl.addEventListener('keydown', (e) => {
      // Allow Enter to evaluate while focused in the field
      if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        resultEl.blur();
        handleAction('=');
      }
      // Escape clears
      if (e.key === 'Escape') {
        e.preventDefault();
        resultEl.blur();
        handleAction('clear');
      }
      // Operators while focused: commit current number then apply operator
      if (['+', '-', '*', '/', '^'].includes(e.key)) {
        e.preventDefault();
        syncFromInput();
        resultEl.blur();
        const map = { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' };
        handleAction(map[e.key]);
      }
    });

    // Global keyboard support (when not typing in the field)
    document.addEventListener('keydown', e => {
      if (e.target === resultEl || e.target.tagName === 'INPUT') return;
      const key = e.key;
      if (/^[0-9.]$/.test(key)) { handleAction(key); e.preventDefault(); }
      else if (key === '+') { handleAction('+'); e.preventDefault(); }
      else if (key === '-') { handleAction('−'); e.preventDefault(); }
      else if (key === '*') { handleAction('×'); e.preventDefault(); }
      else if (key === '/') { handleAction('÷'); e.preventDefault(); }
      else if (key === 'Enter' || key === '=') { handleAction('='); e.preventDefault(); }
      else if (key === 'Backspace') { handleAction('backspace'); e.preventDefault(); }
      else if (key === 'Escape') { handleAction('clear'); e.preventDefault(); }
      else if (key === '%') { handleAction('percent'); e.preventDefault(); }
      else if (key === '(') { handleAction('('); e.preventDefault(); }
      else if (key === ')') { handleAction(')'); e.preventDefault(); }
      else if (key === '^') { handleAction('^'); e.preventDefault(); }
    });

    // Game nav
    document.getElementById('navGen').addEventListener('click', () => showGameTab('gen'));
    document.getElementById('navBoss').addEventListener('click', () => showGameTab('boss'));
    document.getElementById('navUpgrades').addEventListener('click', () => showGameTab('upgrades'));
    document.getElementById('navQuit').addEventListener('click', () => {
      const existing = document.getElementById('quitOverlay');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.id = 'quitOverlay';
      overlay.className = 'quit-overlay';
      overlay.innerHTML = `
        <div class="quit-card">
          <h3>Quit game?</h3>
          <p>Progress is <strong>not saved</strong>. You'll lose all points, upgrades, and boss progress.</p>
          <div class="quit-actions">
            <button id="quitCancel">Stay</button>
            <button class="danger" id="quitConfirm">Quit</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      document.getElementById('quitCancel').addEventListener('click', () => overlay.remove());
      document.getElementById('quitConfirm').addEventListener('click', () => {
        overlay.remove();
        exitGame();
      });
    });

    document.getElementById('bossAttackBtn').addEventListener('click', doBossAttack);
    document.getElementById('bossKillTest').addEventListener('click', () => {
      if (!game.active || game.won || game.bossHearts <= 0) return;
      game.bossHearts = 0;
      playVictorySequence();
    });

    document.getElementById('upgradeList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-up]');
      if (!btn || btn.disabled) return;
      const type = btn.dataset.up;
      const cost = parseInt(btn.dataset.cost, 10);
      const n = btn.dataset.n;
      buyUpgrade(type, cost, n);
    });

    // Init
    renderKeypad();
    updateDisplay();
  </script>
</body>
</html>
